version = 4
console_title_template = '{{if .Root}}Admin: {{end}}{{.UserName}}@{{.HostName}}: {{.PWD}}'
final_space = true
pwd = '{{ if eq .OS "windows" }}osc99{{ else }}osc7{{ end }}'
shell_integration = true

[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    template = ' {{.Icon}}{{if .WSL}} (WSL){{end}} '
    foreground = '#ffffff'
    background = '#3465a4'
    type = 'os'
    style = 'powerline'
    background_templates = ['{{ if eq .OS "linux" }}#185886{{ end }}', '{{ if eq .OS "redhat" }}#e95420{{ end }}', '{{ if eq .OS "ubuntu" }}#e95420{{ end }}']

    [blocks.segments.properties]
      cache_duration = 'none'

  [[blocks.segments]]
    template = '  '
    foreground = '#f5f5f5'
    powerline_symbol = ''
    background = '#b80101'
    type = 'root'
    style = 'powerline'

    [blocks.segments.properties]
      cache_duration = 'none'

  [[blocks.segments]]
    template = ' {{ if .SSHSession }} {{ end }}'
    foreground = '#000000'
    powerline_symbol = ''
    background = '#E2BC66'
    type = 'session'
    style = 'powerline'

    [blocks.segments.properties]
      cache_duration = 'none'

  [[blocks.segments]]
    template = ' {{ .UserName }}@{{ .HostName }} '
    foreground = '#000000'
    powerline_symbol = ''
    background = '#ffffff'
    type = 'session'
    style = 'powerline'

    [blocks.segments.properties]
      cache_duration = 'none'

  [[blocks.segments]]
    template = '  {{ .Full }} '
    foreground = '#faf466'
    powerline_symbol = ''
    background = '#4c83c1'
    type = 'python'
    style = 'powerline'

    [blocks.segments.properties]
      cache_duration = 'none'

  [[blocks.segments]]
    template = ' {{ .Path }} '
    foreground = '#ffffff'
    powerline_symbol = ''
    background = '#3465a4'
    type = 'path'
    style = 'powerline'

    [blocks.segments.properties]
      cache_duration = 'none'
      home_icon = '~'
      style = 'agnoster_full'
      windows_registry_icon = ''

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = ' {{ if gt .Code 0 }} {{ .Meaning }}{{ else }}{{ end }} '
    foreground = '#ffffff'
    background = '#ff8080'
    type = 'status'
    style = 'powerline'
    background_templates = ['{{ if le .Code 0 }}#107c41{{ end }}']

    [blocks.segments.properties]
      always_enabled = true
      cache_duration = 'none'

  [[blocks.segments]]
    foreground = '#000000'
    powerline_symbol = ''
    background = '#ffffff'
    type = 'time'
    style = 'powerline'

    [blocks.segments.properties]
      cache_duration = 'none'

  [[blocks.segments]]
    template = ' {{ .HEAD }} {{ .BranchStatus }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Staging.Changed) (.Working.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0}}  {{ .StashCount }}{{ end }}{{ if gt .WorktreeCount 0}}  {{ .WorktreeCount }}{{ end }} '
    foreground = '#193549'
    powerline_symbol = ''
    background = '#95ffa4'
    type = 'git'
    style = 'powerline'
    foreground_templates = ['{{ if and (gt .Ahead 0) (gt .Behind 0) }}#dc4b3e{{ end }}', '{{ if gt .Behind 0 }}#be9117{{ end }}']

    [blocks.segments.properties]
      branch_icon = ' '
      cache_duration = 'none'
      fetch_stash_count = true
      fetch_status = true
      fetch_upstream_icon = true

      [blocks.segments.properties.untracked_modes]
        '/home/carlos/mnt/' = 'no'

  [[blocks.segments]]
    template = ' $ '
    foreground = '#000000'
    powerline_symbol = ''
    background = '#d3d7cf'
    type = 'text'
    style = 'powerline'

    [blocks.segments.properties]
      cache_duration = 'none'
